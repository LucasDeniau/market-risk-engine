name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Style (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -v